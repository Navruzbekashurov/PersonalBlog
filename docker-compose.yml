version: '3.8'
services:

    # Laravel PHP-FPM
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: laravel_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - './:/var/www'
        networks:
            - laravel
        depends_on:
            - mysql
            - redis
            - mailhog

    # Reverb WebSocket server
    reverb:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: laravel_reverb
        working_dir: /var/www
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        volumes:
            - './:/var/www'
        ports:
            - "8080:8080"
        networks:
            - laravel
        depends_on:
            - app       # backend tayyor bo‘lishini kutadi, app -> reverb cycle yo‘q

    # Nginx
    nginx:
        image: nginx:alpine
        container_name: nginx_server
        ports:
            - "88:80"
        volumes:
            - './:/var/www'
            - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf'
        depends_on:
            - app
            - reverb
        networks:
            - laravel

    # Node / Vite
    npm:
        image: node:20-alpine
        container_name: node_server
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - node_modules:/var/www/node_modules
        environment:
            - CHOKIDAR_USEPOLLING=true
            - WATCHPACK_POLLING=true
        ports:
            - "5173:5173"
        networks:
            - laravel
        depends_on:
            - app
        command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

    # MySQL
    mysql:
        image: mysql:8.0
        container_name: mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: personalblog
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
        volumes:
            - 'mysql-data:/var/lib/mysql'
        ports:
            - '3333:3306'
        networks:
            - laravel

    # Redis
    redis:
        image: redis:alpine
        container_name: redis_server
        ports:
            - '6379:6379'
        networks:
            - laravel

    # Mailhog
    mailhog:
        image: mailhog/mailhog
        container_name: mailhog_server
        ports:
            - "1025:1025"
            - "8025:8025"
        networks:
            - laravel

networks:
    laravel:
        driver: bridge

volumes:
    mysql-data:
    node_modules:
